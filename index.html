<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Market Brief</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --up: #059669;
    --down: #dc2626;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2d3142;
      --up: #34d399;
      --down: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    margin: 0;
    padding: 1.25rem 1rem 2rem;
  }
  .container { max-width: 1180px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  h1 { font-size: 1.65rem; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .date-select {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.4rem 0.75rem;
    font-size: 0.9rem;
    color: var(--text);
  }
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
    margin-bottom: 0.85rem;
  }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 0.75rem;
    font-weight: 600;
  }
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 0.85rem;
    align-items: start;
  }
  .asset, .wallet {
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
  }
  .asset:last-child, .wallet:last-child { border-bottom: none; padding-bottom: 0; }
  .asset-header, .wallet-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.25rem;
  }
  .ticker, .wallet-label { font-weight: 700; font-size: 1.05rem; }
  .change { font-weight: 600; font-size: 0.92rem; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .line { font-size: 0.88rem; margin: 0.1rem 0; }
  .label { color: var(--muted); font-weight: 500; }
  .snapshot-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4rem 1.25rem;
  }
  .snapshot-grid .full { grid-column: 1 / -1; }
  .takeaways { margin: 0; padding-left: 1.1rem; }
  .takeaways li { margin: 0.3rem 0; font-size: 0.92rem; }
  .pos { margin: 0.3rem 0 0.3rem 0.6rem; font-size: 0.86rem; }
  .wallet-total { font-weight: 700; font-size: 1.05rem; margin-right: 0.6rem; }
  .lp-table-wrap { overflow-x: auto; }
  .lp-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
    margin: 0.25rem 0 0.1rem;
  }
  .lp-table th, .lp-table td {
    text-align: left;
    padding: 0.28rem 0.55rem 0.28rem 0;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    white-space: nowrap;
  }
  .lp-table td.note { white-space: normal; color: var(--muted); }
  .lp-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .lp-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .lp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  @media (max-width: 820px) {
    .main-grid { grid-template-columns: 1fr; }
    .snapshot-grid { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Daily Market Brief</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <select class="date-select" id="dateSelect" aria-label="Select market date">
      <option value="latest">Latest</option>
    </select>
  </header>

  <div class="section">
    <h2>Quick Snapshot</h2>
    <div id="snapshot" class="snapshot-grid"></div>
  </div>

  <div class="main-grid">
    <div>
      <div class="section">
        <h2>Equities</h2>
        <div id="equities"></div>
      </div>
      <div class="section">
        <h2>Key Takeaways</h2>
        <ul class="takeaways" id="takeaways"></ul>
      </div>
    </div>
    <div class="section">
      <h2>Crypto</h2>
      <div id="crypto"></div>
    </div>
  </div>

  <div class="section" id="lpSection" hidden>
    <div class="lp-header">
      <h2>LP Positions <span id="lpUpdated" style="font-weight:400;text-transform:none;letter-spacing:0;"></span></h2>
      <select class="date-select" id="lpDateSelect" aria-label="Select LP snapshot">
        <option value="latest">Latest</option>
      </select>
    </div>
    <div id="lp"></div>
  </div>
</div>

<script>
const dateSelect = document.getElementById('dateSelect');
const lpDateSelect = document.getElementById('lpDateSelect');

async function loadHistoryIndex() {
  try {
    const res = await fetch('history/index.json?t=' + Date.now());
    if (!res.ok) return;
    const dates = await res.json();
    dates.sort().reverse();
    dates.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      dateSelect.appendChild(opt);
    });
  } catch (e) {}
}

async function loadLPHistoryIndex() {
  try {
    const res = await fetch('history/lp/index.json?t=' + Date.now());
    if (!res.ok) return;
    const dates = await res.json();
    dates.sort().reverse();
    dates.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      lpDateSelect.appendChild(opt);
    });
  } catch (e) {}
}

dateSelect.addEventListener('change', () => load(dateSelect.value));
lpDateSelect.addEventListener('change', () => loadLP(lpDateSelect.value));

function fmtUsd(n, signed = false) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
  const v = Number(n);
  const core = '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (signed) {
    if (v > 0) return '+' + core;
    if (v < 0) return '-' + core;
    return core;
  }
  return (v < 0 ? '-' : '') + core;
}

function fmtPct(n) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
  const v = Number(n);
  const body = Math.abs(v).toFixed(1) + '%';
  if (v > 0) return '+' + body;
  if (v < 0) return '-' + body;
  return body;
}

function changeClass(n) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return '';
  return Number(n) >= 0 ? 'up' : 'down';
}

async function loadLP(snapshot = 'latest') {
  const section = document.getElementById('lpSection');
  try {
    const url = snapshot === 'latest' ? 'lp.json' : `history/lp/${snapshot}.json`;
    const res = await fetch(url + '?t=' + Date.now());
    if (!res.ok) { section.hidden = true; return; }
    const lp = await res.json();
    const el = document.getElementById('lp');
    document.getElementById('lpUpdated').textContent = lp.updated ? `· ${lp.updated}` : '';
    el.innerHTML = (lp.wallets || []).map(w => {
      const rows = (w.positions || []).map(p => {
        const range = p.inRange ? '🟢 in range' : '🔴 out of range';
        const chg = `<span class="${changeClass(p.change24h ?? p.change24hPct)}">${fmtUsd(p.change24h, true)} (${fmtPct(p.change24hPct)})</span>`;
        const note = p.note ? p.note : '';
        return `<tr>
          <td>${p.pair || '—'}</td>
          <td>${range}</td>
          <td class="num">${fmtUsd(p.value)}</td>
          <td class="num">${fmtUsd(p.fees)}</td>
          <td class="num">${chg}</td>
          <td class="note">${note}</td>
        </tr>`;
      }).join('');
      const table = rows ? `
        <div class="lp-table-wrap">
          <table class="lp-table">
            <thead>
              <tr>
                <th>Pair</th>
                <th>Range</th>
                <th class="num">Value</th>
                <th class="num">Fees</th>
                <th class="num">24h</th>
                <th>Note</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>` : '';
      return `
        <div class="wallet">
          <div class="wallet-header">
            <span class="wallet-label">${w.label}</span>
            <span>
              <span class="wallet-total">${fmtUsd(w.total)}</span>
              <span class="change ${changeClass(w.change24h ?? w.change24hPct)}">${fmtUsd(w.change24h, true)} (${fmtPct(w.change24hPct)})</span>
            </span>
          </div>
          ${table}
        </div>`;
    }).join('');
    section.hidden = false;
  } catch (e) {
    section.hidden = true;
  }
}

async function load(date = 'latest') {
  try {
    const url = date === 'latest' ? 'data.json' : `history/${date}.json`;
    const res = await fetch(url + '?t=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const d = await res.json();

    document.getElementById('meta').textContent = d.date + ' · ' + (d.mood || '').toUpperCase();

    const snap = document.getElementById('snapshot');
    snap.innerHTML = `
      <div class="line full"><span class="label">Mood</span> ${d.mood || '—'}</div>
      <div class="line"><span class="label">SPX</span> ${d.stocks.SPX?.price ?? '—'} <span class="${(d.stocks.SPX?.change||0)>=0?'up':'down'}">${(d.stocks.SPX?.change||0)>=0?'+':''}${d.stocks.SPX?.change ?? ''}</span></div>
      <div class="line"><span class="label">SPY</span> $${d.stocks.SPY?.price ?? '—'} <span class="${(d.stocks.SPY?.change||0)>=0?'up':'down'}">${(d.stocks.SPY?.change||0)>=0?'+':''}${d.stocks.SPY?.change ?? ''}%</span></div>
      <div class="line"><span class="label">QQQ</span> $${d.stocks.QQQ?.price ?? '—'} <span class="${(d.stocks.QQQ?.change||0)>=0?'up':'down'}">${(d.stocks.QQQ?.change||0)>=0?'+':''}${d.stocks.QQQ?.change ?? ''}%</span></div>
      <div class="line"><span class="label">VIX</span> ${d.stocks.VIX?.price ?? '—'} <span class="${(d.stocks.VIX?.change||0)>=0?'up':'down'}">${(d.stocks.VIX?.change||0)>=0?'+':''}${d.stocks.VIX?.change ?? ''}%</span></div>
      <div class="line full"><span class="label">Crypto</span> $${d.crypto.total_mcap ?? '—'}T · TOTAL3 $${d.crypto.TOTAL3 ?? '—'}T</div>
      <div class="line full"><span class="label">Dom</span> BTC.D ${d.crypto['BTC.D'] ?? '—'}% · USDT.D ${d.crypto['USDT.D'] ?? '—'}% · USDC.D ${d.crypto['USDC.D'] ?? '—'}%</div>
    `;

    function assetHtml(ticker, a, isCrypto = false) {
      if (!a) return '';
      const ch = a.change ?? 0;
      const cls = ch >= 0 ? 'up' : 'down';
      const vol = isCrypto
        ? `$${a.volume_total ?? '—'}B total · $${a.volume_onchain ?? '—'}B on-chain · $${a.volume_perps ?? '—'}B perps`
        : `$${((a.volume || 0)/1e9).toFixed(2)}B`;
      return `
        <div class="asset">
          <div class="asset-header">
            <span class="ticker">${ticker}</span>
            <span class="change ${cls}">$${a.price ?? '—'} (${ch>=0?'+':''}${ch}%)</span>
          </div>
          <div class="line"><span class="label">Driver</span> ${a.driver || '—'}</div>
          <div class="line"><span class="label">Sentiment</span> ${a.sentiment || '—'}</div>
          <div class="line"><span class="label">Volume</span> ${vol}</div>
          <div class="line"><span class="label">RSI</span> prev ${a.rsi_prev ?? '—'} · current ${a.rsi_current ?? '—'}</div>
        </div>`;
    }

    document.getElementById('equities').innerHTML =
      assetHtml('TSLA', d.stocks.TSLA) +
      assetHtml('NVDA', d.stocks.NVDA);

    document.getElementById('crypto').innerHTML =
      assetHtml('BTC', d.crypto.BTC, true) +
      assetHtml('ETH', d.crypto.ETH, true) +
      assetHtml('SOL', d.crypto.SOL, true) +
      assetHtml('SUI', d.crypto.SUI, true) +
      assetHtml('SEI', d.crypto.SEI, true);

    document.getElementById('takeaways').innerHTML =
      (d.takeaways || []).map(t => `<li>${t}</li>`).join('');
  } catch (e) {
    document.getElementById('meta').textContent = 'Failed to load data';
  }
}

loadHistoryIndex();
loadLPHistoryIndex();
load();
loadLP();
</script>
</body>
</html>
